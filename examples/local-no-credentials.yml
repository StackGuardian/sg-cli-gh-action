# Policy checks with no StackGuardian account.
#
# Policies are committed in the repository under .tirith/policies/ and evaluated on the runner. The
# pull-request comment, the check run and the exit codes are identical to the platform mode; what you
# give up is run history, the dashboard, and enforcing one policy set across every repository from
# one place.
#
# Add credentials later and nothing else has to change: the action switches to evaluating the
# policies your organization has scoped to the workflow.

name: Policy

on:
  pull_request:

permissions:
  contents: read
  pull-requests: write # sticky comment
  checks: write # check run

jobs:
  policy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.5.7

      - run: terraform init -input=false
      - run: terraform plan -out=tfplan -input=false
        env:
          # A plan needs credentials for the provider even though the policy check does not.
          AWS_REGION: eu-central-1

      # plan.json in the working directory is found by convention, so the step below needs no inputs
      # at all. Prefer `plan-file: tfplan` if you would rather no plan JSON touched the disk.
      - run: terraform show -json tfplan > plan.json

      - id: policy
        uses: StackGuardian/sg-cli-gh-action@v2
        with:
          # Fail the pull request when a policy fails. Without this the comment still appears and the
          # job stays green -- useful while you are writing your first policies.
          fail-on-error: true

          # The default. Set it to a single file or a glob if your policies live elsewhere.
          policy-path: .tirith/policies

      # `mode` says which path ran: `local` here, `platform` once credentials are present. Worth
      # asserting if you intend to require the platform later and do not want a missing secret to
      # quietly downgrade the check.
      - run: echo "evaluated in ${{ steps.policy.outputs.mode }} mode"
