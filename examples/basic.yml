# Pattern A -- two added steps, no restructuring.
#
# Works because a failed step fails the job and subsequent steps do not run, so apply is gated
# with no `needs:`, no job split, and no output plumbing. `tfplan` is still in the workspace, so
# apply applies exactly the bytes that were checked.
#
# Two caveats:
#   - A later step carrying `if: always()` or `if: success() || failure()` WILL still run, so
#     insert the tirith step above any such step.
#   - This shape gates but cannot pause. For a human approval gate, use your own environment
#     protection rules or a separate approval job -- this action does not implement approvals.

name: terraform

on:
  pull_request:
  push:
    branches: [main]

# NOTE: no `paths:` filter. A required check whose workflow never runs pins the PR at
# "Expected -- waiting for status to be reported" forever. Filter inside a job with `if:` instead.

permissions:
  contents: read
  pull-requests: write   # the sticky comment
  checks: write          # the "Tirith IaC Governance" check run
  id-token: write        # your cloud auth, if you use OIDC

env:
  # Supplied as environment rather than inputs so the action needs no `with:` block at all.
  # GitHub does not expose secrets or vars to an action automatically, so this is the only route.
  SG_API_TOKEN: ${{ secrets.SG_API_TOKEN }}   # must be an sgo_ (organization) token
  SG_ORG: ${{ vars.SG_ORG }}

jobs:
  terraform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3

      - run: terraform init -input=false

      - run: terraform plan -out=tfplan -input=false

      # Added: render the plan as JSON for tirith.
      - run: terraform show -json tfplan > plan.json

      # Added: evaluate policies. Policies live in StackGuardian and are selected by their
      # EnforcedOn scope -- nothing about them needs to be configured here.
      #
      # plan.json is found by convention, so the only thing worth setting is whether a failing
      # policy should fail the job. Drop the `with:` block entirely to have it report and pass.
      - uses: StackGuardian/tirith-iac-governance-action@v2
        with:
          fail-on-error: true

      - if: github.event_name == 'push'
        run: terraform apply -auto-approve -input=false tfplan
