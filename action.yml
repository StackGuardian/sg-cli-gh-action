name: "Tirith IaC Governance"
description: "Evaluate Tirith policies against a terraform plan, and report the outcome on the pull request."
author: "StackGuardian"

branding:
  icon: "shield"
  color: "purple"

inputs:
  sg-api-key:
    description: "StackGuardian API key. Must be an organization (sgo_) token: sgu_ tokens are non-functional for SSO-group-only users. May also be supplied as $SG_API_TOKEN. Omit it to evaluate policy files from this repository locally instead. More information: https://docs.stackguardian.io/docs/profile/api_keys/"
    required: false
  sg-org:
    description: "StackGuardian organization name. May also be supplied as $SG_ORG. Omit it to evaluate policy files from this repository locally instead."
    required: false
  policy-path:
    description: "Policy files to evaluate when no credentials are supplied: a file, a directory, or a glob. A directory is searched recursively for *.tirith.json, or failing that for any .json file shaped like a policy. Ignored when SG credentials are present, because policies then come from StackGuardian."
    required: false
    default: ".tirith/policies"
  input-path:
    description: "Path to the document to evaluate, e.g. the output of `terraform show -json tfplan`. Defaults to plan.json or tfplan.json in the working directory."
    required: false
  plan-file:
    description: "Path to a binary terraform plan. Rendered with `terraform show -json` in memory, so no unmasked plan JSON is written to disk. Cannot be combined with input-path."
    required: false
  terraform-bin:
    description: "terraform/tofu binary used for plan-file. Auto-detected, preferring the real binary over the wrapper setup-terraform installs."
    required: false

  sg-region:
    description: "StackGuardian Platform region: eu or us. Sets both the API and dashboard URLs, so run links always match the environment. Defaults to eu."
    required: false
  sg-api-url:
    description: "DEPRECATED -- use sg-region. API base URL, for a self-hosted or dedicated host only. Cannot be combined with sg-region."
    required: false
    deprecationMessage: "Use sg-region instead, unless you are on a self-hosted or dedicated host."
  sg-dashboard-url:
    description: "DEPRECATED -- use sg-region. Dashboard base URL. Inferred from sg-api-url when that names a known region."
    required: false
    deprecationMessage: "Use sg-region instead, unless you are on a self-hosted or dedicated host."

  input-kind:
    description: "What the input document is: terraform_plan, terraform_state, kubernetes, or json. terraform_state is masked before upload and evaluated by the json provider."
    required: false
    default: "terraform_plan"
  state-path:
    description: "Optional path to a terraform state file. Masked in the runner before upload and recorded as the TfStateCleaned run fact."
    required: false
  infracost-path:
    description: "Optional path to an `infracost breakdown --format json` document. Required by policies whose required_provider is stackguardian/infracost; if omitted, the step generates one when such a policy is enforced."
    required: false
  source-dir:
    description: "Terraform source uploaded alongside the documents, so the platform has the code the findings refer to. Defaults to the working directory. Excludes .git, .terraform, *.tfstate* and anything in .gitignore -- but your committed source ships as written, so a secret hardcoded in a .tf file reaches the platform. Point this at a subdirectory to narrow what is sent, or set it to an empty string to send only the masked documents."
    required: false
    default: "."
  terraform-version:
    description: "Recorded on the StackGuardian workflow when it is created."
    required: false

  comment:
    description: "Post a sticky comment on the pull request."
    required: false
    default: "true"
  comment-tag:
    description: "Namespaces the sticky comment, the uploaded archive and the check-run name. Set a distinct value per working directory so matrix jobs do not overwrite each other's comment or archive."
    required: false
    default: "default"
  check:
    description: "Create a 'Tirith IaC Governance' check run on the head commit."
    required: false
    default: "true"

  fail-on-error:
    description: "Exit non-zero (failing the job) when a policy fails. Note that an unreachable platform or a run that produced no verdict always exits non-zero, regardless of this setting."
    required: false
    default: "false"

  timeout:
    description: "Seconds to wait for the StackGuardian run. Runs on one workflow serialize, so a run may be queued behind another."
    required: false
    default: "1800"

  workflow-id:
    description: "Override the derived workflow identity. By default it is github-com-<owner>-<repo>-<workflow-filename>, which is stable across renaming the workflow's `name:`. Slugified if it contains anything outside [A-Za-z0-9_-]."
    required: false
  workflow-group:
    description: "StackGuardian workflow group the workflow belongs to. Policies are scoped per group, so point this at an existing group to have its policies apply. An unknown group is created, and a typo therefore enforces nothing."
    required: false
    default: "default"
  step-template-id:
    description: "Override the StackGuardian policy-evaluation step template. Omit to use the platform's own default."
    required: false
  tirith-version:
    description: "Git ref of py-tirith to install. TEMPORARY default: a branch, until StackGuardian/tirith is tagged 1.2.0. Set this back to a tag before release -- a moving ref means a green pipeline can turn red with nothing in the repository changing."
    required: false
    default: "feat/gate-capable-engine"
  github-token:
    description: "Token used to post the comment and the check run. Never sent to StackGuardian."
    required: false
    default: ${{ github.token }}

outputs:
  mode:
    description: "Which path ran: `platform` (policies from StackGuardian) or `local` (policy files from this repository)."
    value: ${{ steps.tirith.outputs.mode }}
  verdict:
    description: "One of: passed, warned, failed, errored, no-policies."
    value: ${{ steps.tirith.outputs.verdict }}
  passed:
    description: "Number of policy rules that passed."
    value: ${{ steps.tirith.outputs.passed }}
  failed:
    description: "Number of policy rules that failed."
    value: ${{ steps.tirith.outputs.failed }}
  warned:
    description: "Number of policy rules that warned."
    value: ${{ steps.tirith.outputs.warned }}
  results:
    description: "The full PolicyEvalResults document as JSON."
    value: ${{ steps.tirith.outputs.results }}
  results-file:
    description: "Path to the full result document on disk. Prefer this over `results` when aggregating many units."
    value: ${{ steps.tirith.outputs.results-file }}
  wfrun-id:
    description: "The StackGuardian workflow run id."
    value: ${{ steps.tirith.outputs.wfrun-id }}
  wfrun-url:
    description: "Link to the run in StackGuardian."
    value: ${{ steps.tirith.outputs.wfrun-url }}
  comment-id:
    description: "The id of the sticky pull-request comment, if one was posted."
    value: ${{ steps.tirith.outputs.comment-id }}

runs:
  using: composite
  steps:
    - name: Mask the API key
      shell: bash
      # Masks whichever route supplied the key. A token arriving through an env: block backed by a
      # `vars` value is not masked automatically, and neither is one taken from the environment.
      run: |
        for value in "$SG_API_KEY_INPUT" "$SG_API_TOKEN"; do
          if [ -n "$value" ]; then echo "::add-mask::$value"; fi
        done
      env:
        SG_API_KEY_INPUT: ${{ inputs.sg-api-key }}

    - name: Install tirith
      shell: bash
      run: pip install --quiet "py-tirith @ git+https://github.com/StackGuardian/tirith@${{ inputs.tirith-version }}"

    - name: Evaluate policies
      id: tirith
      shell: bash
      run: python3 "${{ github.action_path }}/scripts/main.py"
      env:
        INPUT_SG_API_KEY: ${{ inputs.sg-api-key }}
        INPUT_SG_ORG: ${{ inputs.sg-org }}
        INPUT_SG_REGION: ${{ inputs.sg-region }}
        INPUT_SG_API_URL: ${{ inputs.sg-api-url }}
        INPUT_SG_DASHBOARD_URL: ${{ inputs.sg-dashboard-url }}
        INPUT_POLICY_PATH: ${{ inputs.policy-path }}
        INPUT_INPUT_PATH: ${{ inputs.input-path }}
        INPUT_PLAN_FILE: ${{ inputs.plan-file }}
        INPUT_TERRAFORM_BIN: ${{ inputs.terraform-bin }}
        INPUT_INPUT_KIND: ${{ inputs.input-kind }}
        INPUT_STATE_PATH: ${{ inputs.state-path }}
        INPUT_INFRACOST_PATH: ${{ inputs.infracost-path }}
        INPUT_SOURCE_DIR: ${{ inputs.source-dir }}
        INPUT_TERRAFORM_VERSION: ${{ inputs.terraform-version }}
        INPUT_COMMENT: ${{ inputs.comment }}
        INPUT_COMMENT_TAG: ${{ inputs.comment-tag }}
        INPUT_CHECK: ${{ inputs.check }}
        INPUT_FAIL_ON_ERROR: ${{ inputs.fail-on-error }}
        INPUT_TIMEOUT: ${{ inputs.timeout }}
        INPUT_WORKFLOW_ID: ${{ inputs.workflow-id }}
        INPUT_WORKFLOW_GROUP: ${{ inputs.workflow-group }}
        INPUT_STEP_TEMPLATE_ID: ${{ inputs.step-template-id }}
        INPUT_GITHUB_TOKEN: ${{ inputs.github-token }}
